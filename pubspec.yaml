  flutter: ">=3.47.8"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  devicelocale: ^0.9.1
  provider: ^6.1.5+1
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_analytics: ^13.0.1
  firebase_auth: ^7.0.1
  firebase_messaging: ^17.0.1
  firebase_storage: ^14.0.1
  firebase_database: ^13.0.1
  json_annotation: ^4.12.0
  image_picker: ^1.2.4
  file_picker: ^13.2.0
  image: ^4.12.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  url_launcher: ^6.3.3
  google_maps_flutter: ^2.19.0
  package_info_plus: ^10.2.2
  mime: ^2.1.0
  web: ^1.1.2
  video_player: ^2.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.2
  connectivity_plus: ^7.3.2
