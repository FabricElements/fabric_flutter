  omni_datetime_picker: 2.3.2
  collection: ^1.19.1
  dlibphonenumber: ^1.1.74
  scrollable_positioned_list: ^0.3.8
  gap: ^3.0.1
  google_sign_in_web: ^1.1.3
  image_network: ^2.6.0
  webview_flutter: ^4.14.1
  speech_to_text: ^7.5.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  json_serializable: ^6.15.2
  firebase_core_platform_interface: ^8.1.1
  widgetbook: ^3.25.0

